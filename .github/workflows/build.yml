name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Tạo project
        run: xcodegen generate

      - name: Build (không ký)
        run: |
          xcodebuild -project ScreenGuard.xcodeproj \
            -scheme ScreenGuard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Đóng gói IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ScreenGuard.app Payload/
          zip -r ScreenGuard.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenGuard-ipa
          path: ScreenGuard.ipa
