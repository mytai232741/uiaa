name: ScreenGuard
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  ScreenGuard:
    type: application
    platform: iOS
    sources: [ScreenGuard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.screenguard
        PRODUCT_NAME: ScreenGuard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ScreenGuard
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
